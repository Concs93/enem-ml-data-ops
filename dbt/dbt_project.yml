name: enem
version: '1.0'
profile: enem

model-paths: ['models']
seed-paths: ['seeds']
macro-paths: ['macros']

vars:
  # N minimo de participantes para publicar diagnostico de uma escola.
  # Abaixo disso o resultado e instavel e potencialmente identificavel.
  n_minimo_diagnostico: 20

models:
  enem:
    staging:
      +materialized: view
      stg_resultados:
        +materialized: table
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      +schema: marts
      +pre_hook: "set max_parallel_workers_per_gather = 0"

seeds:
  enem:
    co_prova:
      +column_types:
        co_prova: integer
        is_regular: boolean
    matriz_referencia:
      +column_types:
        habilidade: integer
        competencia: integer
