version: 2

models:
  - name: dim_escola
    description: >
      Uma linha por escola, atributos decodificados pelo seed dominios e
      cadastro do Censo Escolar 2024 (nome, microrregiao, porte, infra).
      Consumida pela aplicacao, nao pelos fatos. Cobre toda escola presente
      nos resultados, inclusive as que nao recebem diagnostico.
    columns:
      - name: co_escola
        tests: [not_null, unique]
      - name: nome_escola
        description: >
          Do Censo 2024. Nula para 12,5% das escolas (0,4% das publicaveis) -
          o Censo do ano do ENEM nao existe quando os microdados saem.
      - name: co_microrregiao
        description: Microrregiao do IBGE - o nivel do roll-up geografico.
      - name: tem_cadastro
        description: A escola casou com o Censo 2024.
        tests: [not_null]
      - name: dependencia
        description: Federal, Estadual, Municipal ou Privada.
      - name: localizacao
        description: Urbana ou Rural.

  - name: mart_escola_area
    description: >
      Presenca, media da nota oficial e percentil por escola e area, apenas
      provas regulares. Percentil calculado somente entre escolas publicaveis
      (n_presentes e n_com_nota acima do minimo), para que a posicao de quem
      tem N suficiente nao oscile com a entrada de escolas instaveis.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [co_escola, area]
    columns:
      - name: co_escola
        tests: [not_null]
      - name: n_presentes
        description: Concluintes presentes na area, em prova regular.
      - name: n_com_nota
        description: >
          Presentes com nota ESTIMAVEL. Exclui prova entregue em branco, cuja
          nota vem como 0 -- sentinela, nao desempenho (Volume 5, secao 2).
      - name: n_prova_em_branco
        description: >
          Presentes que nao marcaram nada. A nota 0 do INEP significa "sem
          padrao de resposta para estimar". Contado a parte em vez de somido
          na media: e informacao pedagogica, nao ruido.
        tests: [not_null]
      - name: percentil
        description: >
          Posicao entre as escolas publicaveis da area, regua unica (todas as
          redes juntas). Nulo quando a escola nao e publicavel.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: publicavel
        description: Atingiu o N minimo definido em var n_minimo_diagnostico.
        tests: [not_null]

  - name: mart_diagnostico_habilidade
    description: >
      O produto do projeto - taxa de acerto por escola, area e habilidade,
      comparada com a referencia nacional, com o numero de itens que sustenta
      cada medida. Grid completo - nenhuma habilidade e omitida, nunca.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [co_escola, area, habilidade]
    columns:
      - name: co_escola
        tests: [not_null]
      - name: n_itens_validos
        description: Lastro da medida na escola. Itens anulados/abandonados fora.
      - name: n_itens_validos_nacional
        description: >
          Lastro da mesma medida na referencia. Difere do da escola nas
          habilidades de lingua estrangeira (LC 5-8), onde o conjunto de itens
          depende do mix de ingles e espanhol dos alunos da escola.
      - name: status
        description: >
          ok (2+ itens validos) | um_item (medida fragil) | nao_administrada
          (nenhum aluno da escola viu itens da habilidade) | nao_avaliada
          (a edicao nao tem item valido).
        tests:
          - not_null
          - accepted_values:
              values: ['ok', 'um_item', 'nao_administrada', 'nao_avaliada']
      - name: publicavel
        description: Gate do N minimo, herdado de mart_escola_area.
        tests: [not_null]
      - name: diferenca
        description: >
          taxa_acerto menos taxa_acerto_nacional, em pontos percentuais.
          Ordena o relatorio - as maiores lacunas primeiro.
      - name: descricao_habilidade
        description: >
          Texto oficial da Matriz de Referencia. E o que transforma
          "habilidade 21" em algo que um coordenador pedagogico le.

  - name: mart_curva_item
    description: >
      O motor psicometrico como tabela - curva caracteristica (3PL) e
      informacao de Fisher de cada item valido das provas regulares, numa
      grade de theta de 0,05. Parametros calibrados pelo INEP; nada e
      ajustado aqui, so avaliado - e por isso o modelo herda versionamento,
      teste e documentacao do proprio dbt.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [co_item, theta]
    columns:
      - name: prob_acerto
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: informacao
        description: Zera nos dois extremos - item facil ou dificil demais nao distingue ninguem.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: mart_calibracao_nota
    description: >
      Calibracao empirica nota -> theta_efetivo, medida em 1,27 a 1,33 mi
      de participantes por area. NAO substitui nem corrige a escala do INEP
      (nota = 100*theta + 500 e definicao, exata): mede outra ponte, a de
      "quantas questoes espera acertar quem tem esta nota", que o INEP nao
      publica. As duas coincidem no miolo (diferenca media ~0,2 entre 450 e
      700) e se afastam nas caudas - no topo porque a nota vem do padrao e
      nao da contagem, no piso porque prova em branco nao chuta e o
      observado cai abaixo do piso de acerto casual do 3PL.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [area, cod_lingua, nota_faixa]
    columns:
      - name: theta_efetivo
        tests: [not_null]
      - name: nota_minima_area
        description: >
          O piso FISICO da escala na edicao - a MENOR nota real em prova
          regular, excluindo o zero (sentinela de prova entregue em branco).
          Populacao: todas as pessoas em prova regular, a mesma do maximo -
          usar populacoes diferentes nas duas pontas daria uma faixa que nao
          existe em lugar nenhum.
        tests: [not_null]
      - name: nota_maxima_area
        description: >
          O teto FISICO da escala na edicao - a maior nota real em prova
          regular (2025 - MT 980,3 · CN 858,7 · CH 856,4 · LC 794,5). Difere
          do topo da curva - o having n >= 100 corta faixas raras, entao a
          curva calibravel termina onde acaba a amostra (~770 em CH), mas a
          escala vai alem. O site limita o "ou mais" por esta coluna.
        tests: [not_null]

  - name: mart_distribuicao_acertos
    description: >
      Distribuicao empirica completa de acertos por faixa de nota - contagem
      pura, sem teoria. Usos - validar entrada do nivel 3 e a frase de
      percentil empirico. NAO autoriza interpretar causa de desvio.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [area, cod_lingua, nota_faixa, acertos]
    columns:
      - name: percentil_ate
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

  - name: mart_perfil_habilidade
    description: >
      A face do aluno - para cada nivel (theta), area (e lingua em LC) e
      habilidade, o acerto esperado e a informacao total dos itens. A
      prioridade ordena por informacao, nao por taxa de erro. Comunicar
      sempre como "onde a prova mais distingue pessoas do seu nivel" - a TRI
      do ENEM e unidimensional e nao autoriza mais que isso.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [theta, area, cod_lingua, habilidade]
    columns:
      - name: prioridade
        description: >
          Ordem por informacao de Fisher - onde a prova mais distingue pessoas
          daquele nivel. Nula quando n_itens = 0 (MT 21 na edicao; LC 8 para
          ingles). Ver perfil_prioridade_condiz.
          ATENCAO: o site NAO ordena por esta coluna. Ele ordena pelo GANHO DE
          UM PASSO (a diferenca de acerto_esperado entre theta e theta+0,5,
          convertida em pontos), porque e esse o numero que a tela mostra - e
          ordem e numero nao podem se contradizer. As duas medidas divergem: a
          informacao ignora quantas questoes a competencia tem, e uma
          competencia de 3 itens muito discriminantes mede com precisao sem ter
          ponto para dar. Esta coluna continua valendo como o fato
          psicometrico; o ganho e a leitura de produto, derivada dela.
      - name: n_itens
        description: O lastro. 62 das 120 habilidades tem um unico item.
        tests: [not_null]

  - name: mart_perfil_estudo
    description: >
      Recomendacao de estudo pelo banco de itens de SEIS edicoes (2020-2025).
      Irmao do mart_perfil_habilidade, e a diferenca e a pergunta - aquele diz
      "o que rendia na prova de 2025" (diagnostico), este diz "o que costuma
      render no seu nivel" (preparacao). Nao sao duas versoes da mesma
      resposta - medido, as tres primeiras competencias coincidem em media
      1,5 de 3, e por isso as duas vao para o site em cartoes separados.
      Motivo de existir - a ordem tirada de metade dos itens de 2025 se
      correlaciona +0,19 com a da outra metade; as cinco edicoes REGULARES
      anteriores preveem 2025 com +0,27 (LC +0,50 · CN +0,42 · MT +0,16 ·
      CH -0,01). Melhor que uma edicao sozinha, e so um pouco - seis provas
      ainda sao poucas, e em CH nao ha transferencia mensuravel.
      So provas REGULARES, como o mart de 2025 - a recomendacao descreve a
      prova que a pessoa vai fazer. O preco esta medido: com todas as
      aplicacoes o lastro ia a ~22 itens por habilidade e o rho a +0,44.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [theta, area, cod_lingua, habilidade]
    columns:
      - name: n_itens_banco
        description: >
          Lastro no banco reunido - minimo 10 por habilidade, contra 0 a 2 na
          prova regular de 2025. E o ganho principal de reunir edicoes.
        tests: [not_null]
      - name: itens_por_prova
        description: >
          Quantas questoes daquele conteudo uma prova costuma ter, pela
          PROPORCAO de itens da area x 45. Proporcao e nao contagem por edicao
          porque o banco tem 12 a 18 versoes de prova por ano - contar cru
          inflaria tudo ~20x. Somam 45 por (nivel, area, lingua); ver
          estudo_escala_de_uma_prova.
        tests: [not_null]
      - name: ganho_passo
        description: >
          Ganho de um passo de estudo (theta -> theta + 0,5) na escala de uma
          prova - mesma unidade do cartao de 2025, para que os dois sejam
          comparaveis lado a lado.
        tests: [not_null]
      - name: prioridade
        description: Ordem por ganho_passo - a mesma regra que a tela exibe.

  - name: mart_item_prova
    description: >
      O caderno de cada prova regular, questao por questao - posicao,
      gabarito, parametros TRI e habilidade. Base do nivel 3 da face do
      aluno: o site corrige o cartao do participante no navegador; as
      respostas dele nunca sobem, e o caderno que desce. Tudo aqui ja e
      publico nos artefatos do INEP.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [co_prova, posicao]
    columns:
      - name: area
        tests:
          - not_null
          - accepted_values:
              values: ['CH', 'CN', 'LC', 'MT']
      - name: cor
        description: Da prova, pelo seed co_prova - e como o participante a conhece.
        tests: [not_null]
      - name: gabarito
        description: X quando o item foi anulado (sem resposta correta).
        tests: [not_null]
      - name: item_valido
        description: >
          Entra na correcao - nem anulado, nem abandonado, com parametros.
          Validos por area - CH 45, CN 42, LC 50, MT 43; o teste
          item_prova_completa trava caderno incompleto.
        tests: [not_null]
      - name: motivo_fora
        description: >
          POR QUE a questao nao vale ponto - nulo quando vale. Sao dois casos
          diferentes e chamar os dois de "anulada" seria impreciso:
          anulada (gabarito X, item ja usado antes, sem resposta correta) e
          sem_calibracao (gabarito valido, mas a TRI nao convergiu e o INEP
          tirou da escoragem - nem quem acertou ganhou ponto).
          Em 2025, nas regulares: MT Q172 sem_calibracao e Q174 anulada;
          CN Q123 e Q132 anuladas, Q125 sem_calibracao.
          A tela nomeia cada uma - o participante respondeu aquela questao.
        tests:
          - accepted_values:
              values: ['anulada', 'sem_calibracao']
      - name: motivo_abandono
        description: Texto oficial do INEP (Previamente exposto, Problema de convergencia).

  - name: mart_geografia_area
    description: >
      A face do gestor, nivel area - municipio, regiao imediata (IBGE 2017),
      UF, regiao e pais numa tabela so. Regra dupla de publicacao (3 escolas
      E 50 participantes) aplicada honestamente em TODO nivel; quem nao passa
      fica na tabela com publicavel = false e codigo_pai apontando para onde
      subir. Boa Esperanca do Norte/MT (municipio de 2025, fora do Censo
      2024) existe aqui sem regiao imediata - a divisao de 2024 realmente
      nao o continha.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [nivel, codigo, area]
    columns:
      - name: nivel
        tests:
          - not_null
          - accepted_values:
              values: ['municipio', 'regiao_imediata', 'uf', 'regiao', 'pais']
      - name: nome
        tests: [not_null]
      - name: publicavel
        tests: [not_null]

  - name: mart_geografia_habilidade
    description: >
      A face do gestor, nivel habilidade - taxa vs nacional nos cinco niveis
      geograficos, com grid completo por unidade e o gate de publicacao
      herdado. Mesmos status do mart de escola - nenhuma habilidade some.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [nivel, codigo, area, habilidade]
    columns:
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['ok', 'um_item', 'nao_administrada', 'nao_avaliada']
      - name: publicavel
        tests: [not_null]

  - name: mart_geografia_competencia
    description: >
      A face do gestor no grao que sustenta decisao: competencia de area, com
      4 a 11 itens por medida em vez de 1 (62 das 120 habilidades tem um item
      so). Traz `perfil` - a diferenca contra o nacional DEPOIS de descontar
      o patamar da propria unidade na area. A diferenca crua e 80% "esta rede
      vai melhor/pior em tudo" (dp 3,52 de 3,93 no nivel UF); pintar um mapa
      com ela seria ranking disfarcado e daria a toda rede o mesmo conselho.
      O perfil responde o que da para agir: dado o nivel geral desta rede,
      qual competencia fica desproporcionalmente para tras.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [nivel, codigo, area, competencia]
    columns:
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['ok', 'nao_administrada', 'nao_avaliada']
      - name: descricao_competencia
        tests: [not_null]
      - name: publicavel
        tests: [not_null]

  - name: mart_diagnostico_competencia
    description: >
      Diagnostico no grao da competencia de area. Mesma pergunta do mart de
      habilidade, com lastro de 4 a 11 itens por medida em vez de 1 ou 2.
      Nao substitui o de habilidade - habilidade e acionavel, competencia e
      confiavel; o relatorio precisa dos dois.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [co_escola, area, competencia]
    columns:
      - name: co_escola
        tests: [not_null]
      - name: descricao_competencia
        tests: [not_null]
      - name: publicavel
        description: Gate do N minimo, herdado de mart_escola_area.
        tests: [not_null]
      - name: n_itens_validos_nacional
        description: >
          Nunca menor que 4 nesta edicao - e exatamente o ganho sobre o grao
          da habilidade, onde 62 de 120 tem um item so.
        tests:
          - dbt_utils.accepted_range:
              min_value: 4
