version: 2

models:
  - name: int_acerto_item_escola
    description: >
      Acertos por escola e item, apenas provas regulares. Itens anulados
      (gabarito X) e abandonados (sem parametro de TRI) sao preservados no grao
      com taxa_acerto nula, para aparecerem no diagnostico como "nao avaliados"
      em vez de sumir.
    columns:
      - name: co_escola
        tests: [not_null]
      - name: item_anulado
        description: Gabarito 'X' - item sem resposta correta, fora da escoragem.
      - name: item_abandonado
        description: Sem parametro de TRI (calibracao nao convergiu) - nao escorado.
      - name: taxa_acerto
        description: Nula para itens anulados/abandonados (nao avaliaveis).
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

  - name: int_distribuicao_acertos
    description: >
      Quantas pessoas com cada nota fizeram cada numero de acertos (itens
      validos, nota > 0). Estatistica suficiente do Passo 0 do PLANO.md - a
      media, o desvio e o percentil empirico saem daqui sem persistir o grao
      por pessoa. Em LC o grao inclui a lingua.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [area, cod_lingua, nota_faixa, acertos]
    columns:
      - name: n
        tests: [not_null]

  - name: int_municipio_geografia
    description: >
      Mapa municipio -> hierarquia IBGE (regiao imediata 2017, UF, regiao),
      com nomes, derivado do cadastro do Censo. Municipio pertence inteiro a
      cada nivel acima - o teste de unicidade denuncia se o cadastro um dia
      contradisser isso.
    columns:
      - name: co_municipio
        tests: [unique, not_null]
      - name: co_regiao_imediata
        tests: [not_null]

  - name: int_acerto_item_municipio
    description: >
      Acertos por municipio x REDE x area x item - o agregado reaproveitavel
      da geografia. Regiao imediata, UF, regiao e pais somam por cima disto.
      A rede 'Todas' e uma LINHA (grouping sets), nao conta do consumidor -
      quem somar sem filtrar rede conta cada resposta duas vezes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [co_municipio, rede, area, co_item]
    columns:
      - name: co_municipio
        description: >
          Hoje nenhuma escola vem sem municipio (conferido 01/08/2026), mas se
          uma edicao futura trouxer, ela entraria no nivel pais do mart de
          competencia e ficaria FORA do de area - divergencia silenciosa entre
          os dois. Este not_null e o alarme (achado do crivo adversarial).
        tests: [not_null]
      - name: rede
        description: >
          Dependencia administrativa da escola de conclusao (Federal,
          Estadual, Municipal, Privada) mais a linha 'Todas'.
        tests:
          - not_null
          - accepted_values:
              values: ['Todas', 'Federal', 'Estadual', 'Municipal',
                       'Privada', 'Sem cadastro']

  - name: int_uf_nivel
    description: >
      Quantos alunos cada UF x REDE tem em cada nivel de nota (grade de
      theta 0,05, lingua em LC com sentinela -1) - os pesos do potencial de
      crescimento por estado. UF e rede vem direto do stg_resultados; a rede
      'Todas' e LINHA (grouping sets) - somar sem filtrar conta duas vezes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [co_uf, rede, area, cod_lingua, theta]
    columns:
      - name: n
        tests: [not_null]

  - name: int_estudo_referencia
    description: >
      O motor da face do aluno como tabela - acertos que um passo de meio
      nivel devolve por (area, lingua, theta, competencia). Materializada de
      proposito: como CTE ao lado de join grande, o planejador estima rows=1
      e cai em laco aninhado (duas versoes canceladas, 51 e 20+ min).
      cod_lingua com sentinela -1 (igualdade hasheavel).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [area, cod_lingua, theta, competencia]
    columns:
      - name: ganho
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: int_nivel_nacional
    description: >
      A referencia da face do gestor: quanto o Brasil acerta em cada
      competencia POR NIVEL DE NOTA (grade de theta de 0,05). Saida minuscula
      e dela saem os DOIS indicadores - o esperado de cada unidade (ponderando
      esta tabela pelo histograma dela) e o ganho de um passo (a mesma tabela
      meio nivel acima). Empirica de proposito: a frase da tela e "do que
      alunos com a mesma nota", e isso so e literal na versao observada. Piso
      de 400 respostas por faixa - abaixo disso a taxa vira ruido que se
      propaga para toda unidade que tiver alguem ali.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [area, cod_lingua, theta, competencia]
    columns:
      - name: taxa_nacional
        tests: [not_null]

  - name: int_acerto_item_nacional
    description: >
      Taxa de acerto nacional por item. Referencia do diagnostico. Itens nao
      avaliaveis (anulados/abandonados) aparecem com taxa_acerto_nacional nula.
    columns:
      - name: co_item
        tests: [not_null]
      - name: item_anulado
        description: Gabarito 'X' - item sem resposta correta, fora da escoragem.
      - name: item_abandonado
        description: Sem parametro de TRI (calibracao nao convergiu) - nao escorado.